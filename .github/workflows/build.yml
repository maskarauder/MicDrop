# SPDX-License-Identifier: MPL-2.0
name: Build and audio contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload build outputs and diagnostic artifacts to GitHub Actions
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host and native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2022
          - os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Windows runner and Defender configuration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command python, cmake, gcc, bash, pwsh -ErrorAction Stop | Format-Table Name, Source
          # Checkout uses a temporary Git config; Go needs trust in the runner account's config too.
          git config --global --fixed-value --replace-all safe.directory $env:GITHUB_WORKSPACE $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Could not trust the Windows checkout for build metadata.' }
          git status --porcelain=v1 --untracked-files=no
          if ($LASTEXITCODE -ne 0) { throw 'Git cannot read the Windows checkout; see its error above.' }
          ./tools/scan_windows.ps1 -ConfigureEphemeralRunner
          ./tools/scan_windows.ps1 -CheckConfiguration
      - name: Select the Windows cgo toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'C:\mingw64\bin\gcc.exe') {
            'C:\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            $gccDir = Split-Path -Parent (Get-Command gcc.exe -ErrorAction Stop).Source
            $gccDir | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Append
          'CXX=g++' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Select the Linux cgo toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
      - name: Select Xcode 26+ and macOS cgo toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            dev_dir=/Applications/Xcode_26.6.app/Contents/Developer
          else
            dev_dir=/Applications/Xcode.app/Contents/Developer
          fi
          export DEVELOPER_DIR="$dev_dir"
          echo "DEVELOPER_DIR=$dev_dir" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/pybin"
            ln -s "$(command -v python3)" "$RUNNER_TEMP/pybin/python"
            echo "$RUNNER_TEMP/pybin" >> "$GITHUB_PATH"
          fi
          sw_vers
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          cmake --version
          python3 --version
      - name: Fetch verified native WebRTC (Windows)
        if: runner.os == 'Windows'
        run: python tools/fetch_webrtc.py windows
      - name: Fetch verified native WebRTC (Linux)
        if: runner.os == 'Linux'
        run: python3 tools/fetch_webrtc.py linux
      - name: Fetch verified native WebRTC (macOS)
        if: runner.os == 'macOS'
        run: python3 tools/fetch_webrtc.py macos
      - name: Configure Unix WebRTC and contracts
        if: runner.os != 'Windows'
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DMICDROP_BUILD_RTC=ON
      - name: Configure Windows WebRTC and contracts
        if: runner.os == 'Windows'
        run: cmake -S . -B build/native -A x64 -DMICDROP_BUILD_RTC=ON
      - run: cmake --build build/native --config Release --parallel 4
      - run: ctest --test-dir build/native -C Release --output-on-failure --verbose
      - name: Validate shared version and draft-release boundaries
        run: |
          python tools/release_version.py
          python -m unittest discover -s tools -p 'test_draft_release.py' -v
      - name: Check Android version-code upgrade ordering
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            python tools/release_version.py --previous 0000000000000000000000000000000000000000
          else
            auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
            python tools/release_version.py --previous "$PREVIOUS_SHA"
          fi
      - name: Validate retained artifact boundaries and retention
        run: python -m unittest discover -s tools -p 'test_store_artifact.py' -v
      - name: Validate Defender positive-control event matching
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test_scan_windows.ps1
      - name: Validate native dependency selection and checksums
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tools -p 'test_fetch_webrtc.py' -v
      - name: Validate iPhone, macOS, and Unix host packaging checks
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tools -p 'test_ios_bundle.py' -v
          python -m unittest discover -s tools -p 'test_swiftpm_pins.py' -v
          python -m unittest discover -s tools -p 'test_ios_version.py' -v
          python -m unittest discover -s tools -p 'test_macos_app_bundle.py' -v
          python -m unittest discover -s tools -p 'test_package_unix_host.py' -v
          python -m unittest discover -s tools -p 'test_generate_apple_icons.py' -v
          python -m unittest discover -s tools -p 'test_apple_signing.py' -v
          python tools/generate_apple_icons.py check
          python tools/check_swiftpm_pins.py lock apps/ios/MicDropKit/Package.resolved third_party/ios-assets/ios-notices.txt
      - name: Validate Android page-size rejection checks
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tools -p 'test_android_page_sizes.py' -v
      - name: Validate latency analysis with known offsets
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/latency-venv"
          "$RUNNER_TEMP/latency-venv/bin/pip" install --requirement tools/latency/requirements.txt
          "$RUNNER_TEMP/latency-venv/bin/python" -m unittest discover -s tools/latency -p 'test_*.py' -v
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l apps/windows-host native internal services)"
      - name: Go tests and native binding
        env:
          CGO_ENABLED: '1'
        run: go test ./...
      - name: Go static checks
        env:
          CGO_ENABLED: '1'
        run: go vet ./...
      - name: Check native macOS desktop controls
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
          MICDROP_DESKTOP_PREVIEW_DIR: ${{ github.workspace }}/build/macos-desktop-preview
        run: go test -count=1 -v ./internal/desktop
      - name: Retain macOS desktop UI preview
        if: runner.os == 'macOS'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.upload_artifacts == true }}
          name: macos-desktop-preview
          path: build/macos-desktop-preview/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Check native Linux desktop controls
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '1'
          MICDROP_DESKTOP_PREVIEW_DIR: ${{ github.workspace }}/build/linux-desktop-preview
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1 || ! ldconfig -p | grep -q 'libgtk-3\.so\.0'; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              for mirror in \
                "https://mirrors.edge.kernel.org/ubuntu/" \
                "https://ftp.osuosl.org/pub/ubuntu/" \
                "http://azure.archive.ubuntu.com/ubuntu/" \
                "https://archive.ubuntu.com/ubuntu/"; do
                if curl -4 -fsSLI --connect-timeout 3 --max-time 5 "${mirror}dists/noble/InRelease" >/dev/null 2>&1 && \
                   curl -4 -fsSLI --connect-timeout 3 --max-time 5 "${mirror}dists/noble-security/InRelease" >/dev/null 2>&1; then
                  printf '%s\tpriority:1\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
                  break
                fi
              done
            fi
            APT_OPTS=(
              -o Acquire::ForceIPv4=true
              -o Acquire::Retries=1
              -o Acquire::http::Timeout=5
              -o Acquire::https::Timeout=5
              -o Acquire::http::No-Cache=false
              -o Acquire::https::No-Cache=false
            )
            DEBIAN_FRONTEND=noninteractive sudo apt-get "${APT_OPTS[@]}" update
            GTK_PKG="libgtk-3-0t64"
            if ! apt-cache show "$GTK_PKG" >/dev/null 2>&1; then
              GTK_PKG="libgtk-3-0"
            fi
            DEBIAN_FRONTEND=noninteractive sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
              xvfb xauth fonts-dejavu-core adwaita-icon-theme "$GTK_PKG"
          fi
          G_DEBUG=fatal-criticals xvfb-run -a -s "-screen 0 1280x960x24" go test -count=1 -v ./internal/desktop
      - name: Retain Linux desktop UI preview
        if: runner.os == 'Linux'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.upload_artifacts == true }}
          name: linux-desktop-preview
          path: build/linux-desktop-preview/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Check native Windows desktop controls
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MICDROP_DESKTOP_PREVIEW_DIR: build/desktop-preview
        run: |
          # Exercise the same common-controls/DPI manifest as the packaged app.
          $DesktopTestResource = Join-Path $PWD 'internal/desktop/desktop_test_windows_amd64.syso'
          try {
            Push-Location apps/windows-host/resources
            try {
              windres desktop.rc -O coff -o $DesktopTestResource
              if ($LASTEXITCODE -ne 0) { throw 'Could not compile the desktop test manifest.' }
            } finally { Pop-Location }
            go test -count=1 -v ./internal/desktop
            if ($LASTEXITCODE -ne 0) { throw 'Native desktop checks failed.' }
          } finally { Remove-Item -LiteralPath $DesktopTestResource -Force -ErrorAction SilentlyContinue }
      - name: Compile Windows desktop manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location apps/windows-host/resources
          try {
            windres desktop.rc -O coff -o ../desktop_windows_amd64.syso
            if ($LASTEXITCODE -ne 0) { throw 'Could not compile the desktop manifest.' }
          } finally { Pop-Location }
      - name: Build Windows host harness
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -o build/host/ ./apps/windows-host
      - name: Prepare macOS Developer ID signing and notarization
        if: runner.os == 'macOS'
        id: macos_signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_DEV_ID_P12_BASE64: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEV_ID_P12_BASE64 || '' }}
          APPLE_DEV_ID_P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEV_ID_P12_PASSWORD || '' }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_PRIVATE_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER_ID || '' }}
        run: python3 tools/apple_signing.py prepare-macos
      - name: Build and package Unix CLI host distribution
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          rm -rf build/host build/host-dist
          mkdir -p build/host build/host-dist
          go build -trimpath -o build/host/micdrop-host ./apps/windows-host
          cp LICENSE NOTICE build/host/
          cp third_party/QR-CODE-NOTICE.txt third_party/DISCOVERY-NOTICES.txt third_party/WEBSOCKET-NOTICE.txt build/host/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp build/native/native/rtc/libmicdrop_rtc.dylib build/host/
            cp .deps/webrtc/macos/webrtc/NOTICE build/host/WEBRTC-NOTICE.txt
            cp .deps/webrtc/macos/webrtc/VERSIONS build/host/WEBRTC-VERSIONS.txt
            python3 tools/apple_signing.py sign-macos build/host/libmicdrop_rtc.dylib build/host/micdrop-host
            mkdir -p build/host-notarize
            cp build/host/libmicdrop_rtc.dylib build/host/micdrop-host build/host-notarize/
            python3 tools/apple_signing.py notarize-macos build/host-notarize
            rm -rf build/host-notarize
            python3 tools/package_unix_host.py package \
              --platform macos-arm64 \
              --stage-dir build/host \
              --output build/host-dist/MicDrop-macos-arm64-host.tar.gz
          else
            cp build/native/native/rtc/libmicdrop_rtc.so build/host/
            cp .deps/webrtc/linux/webrtc/NOTICE build/host/WEBRTC-NOTICE.txt
            cp .deps/webrtc/linux/webrtc/VERSIONS build/host/WEBRTC-VERSIONS.txt
            python3 tools/package_unix_host.py package \
              --platform linux-x64 \
              --stage-dir build/host \
              --output build/host-dist/MicDrop-linux-x64-host.tar.gz
          fi
          rm -rf build/host
      - name: Verify extracted Unix CLI host distribution
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/host-extracted
          mkdir -p build/host-extracted
          if [ "$RUNNER_OS" = "macOS" ]; then
            ARCHIVE="build/host-dist/MicDrop-macos-arm64-host.tar.gz"
            EXTRACT_DIR="build/host-extracted/MicDrop-macos-arm64-host"
            RTC_LIB="$EXTRACT_DIR/libmicdrop_rtc.dylib"
            python3 tools/package_unix_host.py check --platform macos-arm64 --archive "$ARCHIVE"
          else
            ARCHIVE="build/host-dist/MicDrop-linux-x64-host.tar.gz"
            EXTRACT_DIR="build/host-extracted/MicDrop-linux-x64-host"
            RTC_LIB="$EXTRACT_DIR/libmicdrop_rtc.so"
            python3 tools/package_unix_host.py check --platform linux-x64 --archive "$ARCHIVE"
          fi
          # Simulate actions/upload-artifact@v4 stripping outer file permissions before extraction.
          chmod 0644 "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C build/host-extracted
          HOST_BIN="$EXTRACT_DIR/micdrop-host"
          test -x "$HOST_BIN"
          test -x "$RTC_LIB"
          if [ "$RUNNER_OS" = "macOS" ]; then
            python3 tools/apple_signing.py verify-macos-binaries "$RTC_LIB" "$HOST_BIN"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            if readelf -d "$HOST_BIN" | grep -E 'NEEDED.*(gtk|gdk|cairo|X11|wayland)'; then
              echo "Unexpected hard GUI shared-library dependency in micdrop-host" >&2
              exit 1
            fi
            XDG_DATA_TEST="$RUNNER_TEMP/micdrop-xdg-data"
            rm -rf "$XDG_DATA_TEST"
            env -u DISPLAY -u WAYLAND_DISPLAY XDG_DATA_HOME="$XDG_DATA_TEST" "$HOST_BIN" desktop --install-launcher
            test -f "$XDG_DATA_TEST/applications/micdrop.desktop"
            env -u DISPLAY -u WAYLAND_DISPLAY XDG_DATA_HOME="$XDG_DATA_TEST" "$HOST_BIN" desktop --uninstall-launcher
            test ! -e "$XDG_DATA_TEST/applications/micdrop.desktop"
          fi
          "$HOST_BIN" version
          "$HOST_BIN" doctor
          "$HOST_BIN" rtc-check
          "$HOST_BIN" tone --output build/ci-tone.wav --duration 25ms
      - name: Verify live Linux PulseAudio loopback and virtual cable audio
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          HOST_BIN="./build/host-extracted/MicDrop-linux-x64-host/micdrop-host"
          test -x "$HOST_BIN"
          if ! command -v pulseaudio >/dev/null 2>&1 || ! command -v pactl >/dev/null 2>&1; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              for mirror in \
                "https://mirrors.edge.kernel.org/ubuntu/" \
                "https://ftp.osuosl.org/pub/ubuntu/" \
                "http://azure.archive.ubuntu.com/ubuntu/" \
                "https://archive.ubuntu.com/ubuntu/"; do
                if curl -4 -fsSLI --connect-timeout 3 --max-time 5 "${mirror}dists/noble/InRelease" >/dev/null 2>&1 && \
                   curl -4 -fsSLI --connect-timeout 3 --max-time 5 "${mirror}dists/noble-security/InRelease" >/dev/null 2>&1; then
                  printf '%s\tpriority:1\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
                  break
                fi
              done
            fi
            APT_OPTS=(
              -o Acquire::ForceIPv4=true
              -o Acquire::Retries=1
              -o Acquire::http::Timeout=5
              -o Acquire::https::Timeout=5
              -o Acquire::http::No-Cache=false
              -o Acquire::https::No-Cache=false
            )
            DEBIAN_FRONTEND=noninteractive sudo apt-get "${APT_OPTS[@]}" update
            DEBIAN_FRONTEND=noninteractive sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends pulseaudio pulseaudio-utils
          fi
          PA_DIR="$RUNNER_TEMP/micdrop-pulse"
          mkdir -m 700 -p "$PA_DIR/runtime" "$PA_DIR/state"
          export XDG_RUNTIME_DIR="$PA_DIR/runtime"
          export PULSE_RUNTIME_PATH="$PA_DIR/runtime"
          export PULSE_STATE_PATH="$PA_DIR/state"
          export PULSE_SERVER="unix:$PA_DIR/runtime/native"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$PA_DIR/no-dbus"
          PA_PID=""
          cleanup_pulse() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ -f "$PA_DIR/pulse.log" ]; then
              cat "$PA_DIR/pulse.log" >&2 || true
            fi
            if [ -n "$PA_PID" ]; then
              kill "$PA_PID" >/dev/null 2>&1 || true
              for _ in $(seq 1 10); do
                kill -0 "$PA_PID" 2>/dev/null || break
                sleep 0.1
              done
              kill -9 "$PA_PID" >/dev/null 2>&1 || true
              wait "$PA_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_pulse EXIT
          env -u RUNNER_TRACKING_ID pulseaudio --daemonize=no --exit-idle-time=-1 --log-target="file:$PA_DIR/pulse.log" -n \
            -L "module-native-protocol-unix auth-anonymous=1 socket=$PA_DIR/runtime/native" \
            -L "module-null-sink sink_name=MicDropDesktop rate=48000 channels=2 sink_properties=device.description=MicDrop_Desktop" \
            -L "module-null-sink sink_name=MicDropCable rate=48000 channels=2 sink_properties=device.description=MicDrop_Cable" \
            -L "module-remap-source source_name=MicDropVirtualMic master=MicDropCable.monitor source_properties=device.description=MicDrop_Virtual_Mic" \
            </dev/null >/dev/null 2>&1 &
          PA_PID=$!
          for _ in $(seq 1 50); do
            if [ -S "$PA_DIR/runtime/native" ] && timeout 3s pactl info >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$PA_PID" 2>/dev/null; then
              exit 1
            fi
            sleep 0.1
          done
          timeout 5s pactl info >/dev/null
          timeout 5s pactl set-default-sink MicDropDesktop
          timeout 5s pactl set-default-source MicDropVirtualMic

          mkdir -p build/linux-audio-check
          timeout 10s "$HOST_BIN" devices > build/linux-audio-check/devices.json
          timeout 10s "$HOST_BIN" bridge-devices > build/linux-audio-check/bridge-devices.json

          # Missing explicit endpoints must fail closed rather than falling back to default.
          if timeout 10s "$HOST_BIN" capture --device MissingSink --duration 100ms >/dev/null 2>&1; then
            echo "Expected missing explicit sink to fail closed" >&2
            exit 1
          fi

          # Simultaneously inject synthetic stereo tone into MicDropCable and capture from its monitor.
          # PulseAudio module-null-sink sleeps in 2s BLOCK_USEC intervals while idle, so allow 2.2s
          # for the sink thread to wake into low-latency streaming before starting the 2.5s capture.
          timeout 20s "$HOST_BIN" bridge-check \
            --render-device MicDropCable \
            --duration 6000ms \
            > build/linux-audio-check/bridge-cable.json &
          BRIDGE_PID=$!
          sleep 2.2
          timeout 15s "$HOST_BIN" capture \
            --device MicDropCable \
            --duration 2500ms \
            --output build/linux-audio-check/cable-loopback.wav \
            > build/linux-audio-check/capture-cable.json
          wait "$BRIDGE_PID"

          # Verify default output sink resolution (no --device flag) with live audio.
          timeout 20s "$HOST_BIN" bridge-check \
            --render-device MicDropDesktop \
            --duration 6000ms \
            > build/linux-audio-check/bridge-default.json &
          DEF_BRIDGE_PID=$!
          sleep 2.2
          timeout 15s "$HOST_BIN" capture \
            --duration 2500ms \
            > build/linux-audio-check/capture-default.json
          wait "$DEF_BRIDGE_PID"

          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("build/linux-audio-check")
          devices = json.loads((base / "devices.json").read_text(encoding="utf-8"))
          by_id = {d["id"]: d for d in devices}
          assert by_id["MicDropDesktop"]["default_multimedia"] is True, devices
          assert by_id["MicDropCable"]["default_multimedia"] is False, devices

          bridge_devs = json.loads((base / "bridge-devices.json").read_text(encoding="utf-8"))
          render_ids = {d["id"] for d in bridge_devs["render_endpoints"]}
          input_ids = {d["id"] for d in bridge_devs["recording_endpoints"]}
          assert {"MicDropDesktop", "MicDropCable"} <= render_ids, bridge_devs
          assert "MicDropVirtualMic" in input_ids, bridge_devs
          assert "MicDropCable.monitor" not in input_ids, bridge_devs

          bridge_report = json.loads((base / "bridge-cable.json").read_text(encoding="utf-8"))
          assert bridge_report["render_device"]["id"] == "MicDropCable", bridge_report
          assert bridge_report["submitted_frames"] == 288000, bridge_report

          cap_cable = json.loads((base / "capture-cable.json").read_text(encoding="utf-8"))
          assert cap_cable["device"]["id"] == "MicDropCable", cap_cable
          assert cap_cable["frames"] >= 96000, cap_cable
          assert len(cap_cable["channel_levels"]) == 2, cap_cable
          for level in cap_cable["channel_levels"]:
              assert 0.02 <= level["peak_linear"] <= 0.08, cap_cable
              assert level["rms_linear"] > 0.005, cap_cable
          wav_path = Path(cap_cable["wav_file"])
          assert wav_path.is_file() and wav_path.stat().st_size > 384000, wav_path

          cap_def = json.loads((base / "capture-default.json").read_text(encoding="utf-8"))
          assert cap_def["device"]["id"] == "MicDropDesktop", cap_def
          assert cap_def["device"]["default_multimedia"] is True, cap_def
          assert cap_def["frames"] >= 96000, cap_def
          assert cap_def["channel_levels"][0]["peak_linear"] >= 0.02, cap_def
          print("Verified live Linux PulseAudio sink discovery, virtual mic bridge, and PCM loopback capture.")
          PY
      - name: Retain Linux CLI host
        if: runner.os == 'Linux'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          retain-release-bundle: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          name: linux-x64-host
          path: build/host-dist/MicDrop-linux-x64-host.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Verify Linux draft-release packaging without uploading
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tools/draft_release.py stage --platform linux --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA"
      - name: Retain macOS CLI host
        if: runner.os == 'macOS'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          retain-release-bundle: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          name: macos-arm64-host
          path: build/host-dist/MicDrop-macos-arm64-host.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Build, sign, and verify macOS desktop app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          rm -rf build/macos-app build/macos-app-dist build/macos-app-extracted
          mkdir -p build/macos-app build/macos-app-dist build/macos-app-extracted
          go build -trimpath -o build/macos-app/MicDrop-bin ./apps/windows-host
          python3 tools/macos_app_bundle.py build \
            --executable build/macos-app/MicDrop-bin \
            --rtc-dylib build/native/native/rtc/libmicdrop_rtc.dylib \
            --webrtc-notice .deps/webrtc/macos/webrtc/NOTICE \
            --webrtc-versions .deps/webrtc/macos/webrtc/VERSIONS \
            --output-app build/macos-app/MicDrop.app
          rm -f build/macos-app/MicDrop-bin
          python3 tools/apple_signing.py sign-macos \
            build/macos-app/MicDrop.app/Contents/Frameworks/libmicdrop_rtc.dylib \
            build/macos-app/MicDrop.app
          python3 tools/apple_signing.py notarize-macos build/macos-app/MicDrop.app --staple
          python3 tools/macos_app_bundle.py zip \
            --app build/macos-app/MicDrop.app \
            --output build/macos-app-dist/MicDrop-macos-arm64-app.zip
          rm -rf build/macos-app
          chmod 0644 build/macos-app-dist/MicDrop-macos-arm64-app.zip
          ditto -x -k build/macos-app-dist/MicDrop-macos-arm64-app.zip build/macos-app-extracted
          test -x build/macos-app-extracted/MicDrop.app/Contents/MacOS/MicDrop
          python3 tools/apple_signing.py verify-macos-app build/macos-app-extracted/MicDrop.app
          ./build/macos-app-extracted/MicDrop.app/Contents/MacOS/MicDrop version
          ./build/macos-app-extracted/MicDrop.app/Contents/MacOS/MicDrop doctor
          ./build/macos-app-extracted/MicDrop.app/Contents/MacOS/MicDrop rtc-check
      - name: Retain macOS desktop app
        if: runner.os == 'macOS'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          retain-release-bundle: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          name: macos-arm64-app
          path: build/macos-app-dist/MicDrop-macos-arm64-app.zip
          if-no-files-found: error
          retention-days: 14
      - name: Verify macOS draft-release packaging without uploading
        if: runner.os == 'macOS'
        shell: bash
        run: python3 tools/draft_release.py stage --platform macos --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA"
      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-H=windowsgui" -o build/host/MicDrop.exe ./apps/windows-host
      - name: Prepare Windows release payload and notices
        if: runner.os == 'Windows'
        run: python tools/windows_payload.py
      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_windows_installer.ps1 -PayloadDirectory build/host -OutputDirectory build/windows-installer
      - name: Check isolated Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: ./tools/test_windows_installer.ps1 -PayloadDirectory build/host -CompilerPath .deps/inno-setup-7.1.0/ISCC.exe -ReportDirectory build/windows-installer-tests
      - name: Scan Windows package with Microsoft Defender
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./tools/scan_windows.ps1 -Path build/host,build/windows-installer -ReportDirectory build/windows-defender-scan
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build\host\windows-host.exe doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\host\windows-host.exe rtc-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\host\windows-host.exe tone --output build\ci-tone.wav --duration 25ms
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows antivirus scan report
        if: always() && runner.os == 'Windows'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true || job.status == 'failure' }}
          name: windows-defender-scan
          path: build/windows-defender-scan/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain Windows diagnostic harness
        if: runner.os == 'Windows'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          retain-release-bundle: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          name: windows-x64-harness
          path: build/host/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain Windows installer test report
        if: always() && runner.os == 'Windows'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true || job.status == 'failure' }}
          name: windows-installer-tests
          path: build/windows-installer-tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain per-user Windows installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          retain-release-bundle: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          name: windows-x64-installer
          path: build/windows-installer/
          if-no-files-found: error
          retention-days: 14
      - name: Verify Windows draft-release packaging without uploading
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/draft_release.py stage --platform windows --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA"
      - name: Remove runner Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: python3 tools/apple_signing.py cleanup

  rendezvous:
    name: Remote rendezvous contracts and service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Relay and service race contracts
        run: go test -race ./internal/rendezvous ./services/signaling
      - name: Validate Caddy certificate permissions and renewal
        run: |
          sudo apt-get update
          sudo apt-get install --yes acl
          bash -n deploy/systemd/install.sh
          sudo python3 -B -m unittest discover -s deploy/systemd -p 'test_*.py' -v
      - name: Build standalone rendezvous
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o build/rendezvous/micdrop-rendezvous ./services/signaling
          python tools/package_service_docs.py
          mkdir -p build/rendezvous/systemd
          cp deploy/systemd/install.sh deploy/systemd/caddy-access.py deploy/systemd/*.service deploy/systemd/*.timer build/rendezvous/systemd/
          cp third_party/WEBSOCKET-NOTICE.txt third_party/DISCOVERY-NOTICES.txt build/rendezvous/
          cp LICENSE NOTICE build/rendezvous/
      - name: Verify systemd units
        run: |
          sudo install -m 0755 build/rendezvous/micdrop-rendezvous /usr/local/bin/micdrop-rendezvous
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
      - name: Retain rendezvous development service
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          name: rendezvous-linux-x64
          path: build/rendezvous/*
          if-no-files-found: error
          retention-days: 14

  android-pairing:
    name: Android pairing platform contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      - name: Install pinned Android packages
        run: |
          mkdir -p "$RUNNER_TEMP/.android"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/.android" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator"
      - name: Enable KVM permissions on Ubuntu runner
        run: |
          if [ -e /dev/kvm ] && { [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; }; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Check emulator acceleration and disk space
        run: |
          test -r /dev/kvm && test -w /dev/kvm || { echo '::error::The Linux runner requires hardware virtualization (/dev/kvm) for Android emulator pairing tests.'; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -accel-check
          df -h "$ANDROID_HOME" "$RUNNER_TEMP"
      - name: Verify Android Keystore and Conscrypt mutual TLS
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew --no-daemon -PmicdropPairingOnly=true :pairing-check:connectedDebugAndroidTest
      - name: Retain pairing platform test reports
        if: always()
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true || job.status == 'failure' }}
          name: android-pairing-test-reports
          path: |
            apps/android/pairing-check/build/reports/androidTests/
            apps/android/pairing-check/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android arm64 app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      - name: Install pinned Android packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;35.0.0"
          "ndk;27.0.12077973"
      - name: Fetch verified Android WebRTC
        run: python tools/fetch_webrtc.py android
      - name: Prepare Android development signing
        id: android_signing
        env:
          MICDROP_DEBUG_KEYSTORE_BASE64: ${{ secrets.MICDROP_DEBUG_KEYSTORE_BASE64 }}
        run: python tools/android_signing.py prepare
      - name: Test, compile, and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify Android native 16 KB alignment
        run: |
          python tools/check_android_page_sizes.py apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify Android APK signing certificate
        run: >-
          python tools/android_signing.py verify
          apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Retain Android APK directly
        id: android_apk
        if: steps.android_signing.outputs.stable_signer == 'true'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: ${{ github.event_name == 'push' || inputs.upload_artifacts == true }}
          retain-release-bundle: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          name: android-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Show Android APK download link
        if: steps.android_apk.outputs.artifact-url != ''
        env:
          APK_DOWNLOAD_URL: ${{ steps.android_apk.outputs.artifact-url }}
        run: echo "[Download app-debug.apk]($APK_DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Android draft-release packaging without uploading
        if: steps.android_signing.outputs.stable_signer == 'true'
        run: python tools/draft_release.py stage --platform android --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA"
      - name: Remove runner signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${MICDROP_DEBUG_KEYSTORE:-}" ]; then
            rm -f -- "$MICDROP_DEBUG_KEYSTORE"
            rmdir -- "$(dirname -- "$MICDROP_DEBUG_KEYSTORE")"
          fi

  ios-package:
    name: iPhone portable Swift contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SWIFT_CI_IMAGE: swift:6.3.3-noble@sha256:cd45c27b3abc42310c33cfaf3008b18156cbdc9187834c9617e8f43a26d2675c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare Swift build scratch directory
        run: |
          cache="$RUNNER_TEMP/swift-6.3.3-build"
          mkdir -p "$cache"
          echo "SWIFT_BUILD_DIR=$cache" >> "$GITHUB_ENV"
          docker run --rm "$SWIFT_CI_IMAGE" swift --version
      - name: Require committed Swift package pins
        run: |
          if [ ! -f apps/ios/MicDropKit/Package.resolved ]; then
            echo "::error file=apps/ios/MicDropKit/Package.resolved::Commit SwiftPM-generated pins with the package manifest and notices before building."
            exit 1
          fi
      - name: Build portable package and tests from pinned versions
        id: build
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/swift-build.log"
          status=0
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$SWIFT_BUILD_DIR:/swift-build" "$SWIFT_CI_IMAGE" \
            swift build --package-path apps/ios/MicDropKit --scratch-path /swift-build \
            --force-resolved-versions --jobs 2 --build-tests 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Swift build errors (unique)"
            grep -E 'error:' "$log" | sort -u | head -n 300 || true
            echo "::endgroup::"
            grep -E '^/[^:]+:[0-9]+:[0-9]+: error: ' "$log" | sort -u | head -n 30 | while IFS= read -r line; do
              file=${line%%:*}; rest=${line#*:}; row=${rest%%:*}; rest=${rest#*:}; column=${rest%%:*}
              message=${rest#*: error: }; message=${message//%/%25}
              echo "::error file=${file#"$GITHUB_WORKSPACE/"},line=$row,col=$column::$message"
            done || true
            exit "$status"
          fi
      - name: Portable Swift contracts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$SWIFT_BUILD_DIR:/swift-build" "$SWIFT_CI_IMAGE" \
            swift test --package-path apps/ios/MicDropKit --scratch-path /swift-build \
            --force-resolved-versions --jobs 2 --skip-build

  ios-format:
    name: iPhone Swift formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SWIFT_CI_IMAGE: swift:6.3.3-noble@sha256:cd45c27b3abc42310c33cfaf3008b18156cbdc9187834c9617e8f43a26d2675c
      SWIFT_SOURCES: apps/ios/MicDrop apps/ios/MicDropAppTests apps/ios/MicDropKit/Package.swift apps/ios/MicDropKit/Sources apps/ios/MicDropKit/Tests
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Swift formatting
        id: lint
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$SWIFT_CI_IMAGE" swift format lint --strict --recursive \
            --configuration apps/ios/.swift-format $SWIFT_SOURCES
      - name: Prepare automatic formatting patch
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$SWIFT_CI_IMAGE" swift format format --in-place --recursive \
            --configuration apps/ios/.swift-format $SWIFT_SOURCES
          mkdir -p build
          git diff --no-color > build/swift-format.patch
          git diff --stat
          echo "Apply the swift-format.patch artifact with 'git apply swift-format.patch'. Findings that swift-format cannot fix automatically remain in the lint output above."
      - name: Retain automatic formatting patch
        if: failure() && steps.lint.outcome == 'failure'
        uses: ./.github/actions/store-artifact
        with:
          upload-to-github: true
          name: swift-format-patch
          path: build/swift-format.patch
          archive: false
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
